<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="slideshow-wrapper">
            <div class="image-container" id="imageContainer">
                <img id="mainImage" src="" alt="Slide">
                <div class="clickable-area" id="clickableArea"></div>
            </div>
            <div class="arrow arrow-left" id="prevArrow">‹</div>
            <div class="arrow arrow-right" id="nextArrow">›</div>
        </div>
    </div>

    <div class="fullscreen-overlay" id="fullscreenOverlay">
        <img id="fullscreenImage" src="" alt="Fullscreen">
    </div>

    <script src="script.js"></script>
</body>
</html>
