<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Double-Tap Fullscreen Slideshow</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="slideshow">
  <!-- Wide invisible tap zones -->
  <div class="tap-zone left-zone" onclick="prevImage()"></div>
  <div class="tap-zone right-zone" onclick="nextImage()"></div>

  <!-- Visible arrows -->
  <button class="arrow left" onclick="prevImage()">‹</button>
  <img id="slide" src="" alt="Slideshow Image" />
  <button class="arrow right" onclick="nextImage()">›</button>
</div>

<script src="script.js"></script>
</body>
</html>
